[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-log-analyzer"
version = "0.1.0"
description = "Rule-based and machine-learning security log anomaly detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2",
    "pandas>=2.1,<3",
    "pydantic>=2.5,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.4,<2",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
ai-security = "ai_security.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

